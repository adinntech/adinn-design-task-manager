services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APACHE_DOCUMENT_ROOT: /var/www/html/public

    container_name: php85_app
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro

    environment:
      TZ: Asia/Kolkata

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: adinn_design_task_manager
      DB_USERNAME: root
      DB_PASSWORD: root

    depends_on:
      db:
        condition: service_healthy

    networks:
      - php_local_network


  db:
    image: mariadb:10.4.32

    container_name: php85_db
    restart: unless-stopped

    ports:
      # Windows/XAMPP MariaDB = 3306
      # Docker MariaDB = 3307 from Windows
      - "3307:3306"

    environment:
      TZ: Asia/Kolkata

      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: adinn_design_task_manager

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - php_local_network


  phpmyadmin:
    image: phpmyadmin:5.2.3-apache

    container_name: php85_phpmyadmin
    restart: unless-stopped

    ports:
      - "8081:80"

    environment:
      PMA_HOST: db
      PMA_PORT: 3306

      PMA_USER: root
      PMA_PASSWORD: root

      UPLOAD_LIMIT: 256M

    depends_on:
      db:
        condition: service_healthy

    networks:
      - php_local_network


volumes:
  mariadb_data:


networks:
  php_local_network:
    driver: bridge