services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: adinn_design_task_app

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html

    depends_on:
      db:
        condition: service_healthy

    networks:
      - adinn_network


  db:
    image: mariadb:10.4

    container_name: adinn_design_task_db

    restart: unless-stopped

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: adinn_design_task_manager
      MYSQL_USER: root
      MYSQL_PASSWORD: 

    volumes:
      - adinn_db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - adinn_network


  phpmyadmin:
    image: phpmyadmin:latest

    container_name: adinn_design_task_phpmyadmin

    restart: unless-stopped

    ports:
      - "8081:80"

    environment:
      PMA_HOST: db
      PMA_PORT: 3306

    depends_on:
      db:
        condition: service_healthy

    networks:
      - adinn_network


networks:
  adinn_network:
    driver: bridge


volumes:
  adinn_db_data: