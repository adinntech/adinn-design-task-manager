# Builds the Android app and publishes it as a FORCED in-app update + push notification.
# Runs on every push to the live branch that changes mobile/. See mobile/RELEASING.md for the one-time secrets.
name: Mobile release

on:
  push:
    branches: [laravel-srinivashan-open-AI]
    paths: ['mobile/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify only, do not publish'
        type: boolean
        default: true

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/adinn-release.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=app/adinn-release.jks"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Work out version
        id: ver
        run: |
          NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+[:space:]]+).*/\1/')
          BUILD=$((100 + ${{ github.run_number }}))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME ($BUILD)"

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.build }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Verify signing certificate
        env:
          EXPECTED: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "APK certificate: $ACTUAL"
          if [ "${ACTUAL,,}" != "${EXPECTED,,}" ]; then
            echo "::error::APK is not signed with the expected release key"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: adinn-design-tasks-${{ steps.ver.outputs.name }}-build${{ steps.ver.outputs.build }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish to server
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          RELEASE_URL: ${{ secrets.RELEASE_URL }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          NOTES_TEXT=$(printf '%s' "${NOTES:-Improvements and fixes.}" | head -n 1 | cut -c1-300)
          curl --fail-with-body -sS --max-time 900 \
            -H "Authorization: Bearer $RELEASE_TOKEN" \
            -F "apk=@$APK;type=application/vnd.android.package-archive" \
            -F "build=${{ steps.ver.outputs.build }}" \
            -F "version=${{ steps.ver.outputs.name }}" \
            -F "sha256=$SHA" \
            -F "notes=$NOTES_TEXT" \
            -H "Accept: application/json" \
            "$RELEASE_URL"

      - name: Check the server now serves this build
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          FEED="${{ secrets.API_BASE_URL }}/app-update"
          GOT=$(curl -fsS "$FEED" | python3 -c 'import sys,json; print(json.load(sys.stdin)["latest_build"])')
          echo "Server latest_build: $GOT"
          [ "$GOT" = "${{ steps.ver.outputs.build }}" ] || { echo "::error::Server does not show the new build"; exit 1; }
