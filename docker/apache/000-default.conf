<VirtualHost *:80>

    ServerAdmin webmaster@localhost

    # Default is 60s: too short for large (up to 6 GB) file uploads on slow
    # connections, which would otherwise get cut off mid-request. Matches
    # docker/php/php.ini's max_execution_time/max_input_time.
    Timeout 3600

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>