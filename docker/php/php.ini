[PHP]
date.timezone = Asia/Kolkata

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 512M
max_execution_time = 3600
max_input_time = 3600

; upload_max_filesize is the per-file cap (matches the app's 6 GB validation
; rules); post_max_size stays above it to leave headroom for multipart
; overhead and any additional smaller fields/files in the same request
; (e.g. multiple reference files alongside other form fields).
upload_max_filesize = 6144M
post_max_size = 7168M
max_file_uploads = 50

session.gc_maxlifetime = 1440

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
